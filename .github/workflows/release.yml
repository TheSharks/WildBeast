name: Release

on:
  push:
    branches: [master]

permissions:
  # Push the version bump commits and tags.
  contents: write
  # Open and update the "Version Packages" PR.
  pull-requests: write
  # Explicitly dispatch images for tags created with GITHUB_TOKEN.
  actions: write
  # npm trusted publishing (OIDC) and provenance attestation.
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # changeset publish shells out to npm; trusted publishing needs
      # npm >= 11.5.1, newer than what Node 22 bundles.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Unit tests only: the docker-gated integration suites skip
      # themselves when their service env vars are absent. Gates npm
      # publish on green tests.
      - name: Test
        run: pnpm test

      # With pending changesets this opens/updates the "Version Packages"
      # PR; when that PR is merged, it publishes the bumped packages to npm
      # (authenticated via the OIDC trusted publisher, no token secret) and
      # creates the release tags.
      - name: Version or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GITHUB_TOKEN tag pushes do not trigger other workflows. Dispatch the
      # bot image explicitly, including private-package-only releases.
      - name: Publish tagged bot image
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./apps/discord/package.json').version")
          tag="@thesharks/discord@$version"
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "No bot release tag for this version; skipping image dispatch"
            exit 0
          fi
          if [ "$(git rev-list -n 1 "$tag")" != "$GITHUB_SHA" ]; then
            echo "Bot version was released by an earlier commit; skipping image dispatch"
            exit 0
          fi
          gh workflow run docker-publish.yml --ref "$tag"
