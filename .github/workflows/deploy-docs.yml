name: Deploy docs

on:
  push:
    branches: [master]
    paths:
      - 'apps/docs/**'
      - 'packages/tagscript/**'
      # The changelog pages render these files; redeploy when a release
      # rewrites them. packages/tagscript/** already covers TagScript's.
      - 'apps/discord/CHANGELOG.md'
      - 'packages/analytics/CHANGELOG.md'
      - '.github/workflows/deploy-docs.yml'
  # PR preview: build the site to validate docs changes without deploying.
  # The deploy job below is skipped on pull_request, so PRs are build-only.
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'packages/tagscript/**'
      - 'apps/discord/CHANGELOG.md'
      - 'packages/analytics/CHANGELOG.md'
      - '.github/workflows/deploy-docs.yml'
  # Deploy on demand for changes outside the watched paths.
  workflow_dispatch:
  # New translations on Crowdin touch nothing in git, so nothing above would
  # ever publish them. Rebuild daily to pick them up.
  schedule:
    - cron: '30 5 * * *'

permissions:
  contents: read
  # Publish to GitHub Pages via the deployment API.
  pages: write
  # Mint the OIDC token deploy-pages authenticates with.
  id-token: write

# One Pages deployment at a time, and let a running deploy finish so the
# site never serves a half-published build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Translations aren't committed; pull the finished ones into the
      # workspace. A file that isn't fully translated is skipped, so the
      # page falls back to English with a notice instead of mixing languages.
      # If Crowdin is unreachable, the site deploys in English.
      - name: Download translations
        # Secrets aren't available to pull requests; previews stay English.
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: crowdin/github-action@v3
        with:
          upload_sources: false
          download_translations: true
          skip_untranslated_files: true
          push_translations: false
          create_pull_request: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      # turbo builds @thesharks/tagscript first (dependsOn ^build); the
      # docs playground imports it.
      - name: Build site
        run: pnpm exec turbo run build --filter=@thesharks/docs

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

  deploy:
    # Preview only on PRs: build validates, but only pushes deploy to Pages.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
